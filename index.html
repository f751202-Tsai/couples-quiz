<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170d22">
<title>💞 默契大挑戰</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#170d22;background-image:radial-gradient(1200px 600px at 15% -10%,#4b1f5e 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#3b1a50 0%,transparent 60%);background-attachment:fixed;color:#fff5f9;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:.65em 1.1em;background:#ff5c9a;color:#fff;cursor:pointer;touch-action:manipulation;transition:transform .08s}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;pointer-events:none}
button.ghost{background:rgba(255,255,255,.12)}
button.big{font-size:1.2em;padding:.8em 1.6em}
button.sm{font-size:.85em;padding:.4em .7em;border-radius:10px}
button.full{width:100%}
input,select.ct{font:inherit;padding:.55em .75em;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.28);color:#fff;width:100%;margin-top:4px}
select.ct{width:auto;margin:0}
select option{color:#000}
select.lang{font:inherit;font-size:.85em;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:.45em .5em}
label{display:block;font-size:.9em;color:#e3cfee;margin-bottom:8px;text-align:left}
.muted{color:#c9b3d6}.small{font-size:.82em}
.badge{display:inline-block;padding:.3em .9em;border-radius:999px;background:rgba(255,255,255,.13);font-weight:700}
.rolebadge{display:inline-block;padding:.25em .7em;border-radius:999px;background:#ffc74d;color:#2a1600;font-weight:900;font-size:.85em}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-weight:900;margin:4px 4px 0 0;font-size:.85em;background:rgba(255,255,255,.15)}
.x2{background:#ffc74d;color:#3a2200}
.chip{display:inline-block;background:rgba(255,255,255,.13);border-radius:8px;padding:2px 8px;font-size:.82em;margin:2px 3px 2px 0}

.landing{max-width:460px;margin:0 auto;padding:12vh 20px 40px;display:flex;flex-direction:column;gap:14px;text-align:center}
.landing h1{font-size:2.2em;margin:0 0 10px}
.toplang{position:fixed;top:12px;right:12px}
.joinrow{display:flex;gap:8px;margin-top:6px}.joinrow input{margin:0;font-size:1.3em;text-align:center;letter-spacing:.2em}

.host{display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(0,0,0,.28);flex-wrap:wrap}
.brand{font-weight:900;font-size:1.15em}
#net{flex:1;color:#d9c6e6}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 4vw;text-align:center;gap:1.6vh}
.ctrl{padding:10px 18px 18px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.ctrl button{font-size:1.25em;min-width:40%}
.title{font-size:clamp(28px,4.5vw,60px);margin:0}
.title.huge{font-size:clamp(48px,9vw,130px)}
.rule{font-size:clamp(18px,2.4vw,30px);margin:0}
.qtext{font-size:clamp(28px,5.2vw,74px);font-weight:900;line-height:1.25;max-width:20ch}
.qtext.sm{font-size:clamp(22px,3.4vw,46px)}
.note{color:#ffd3e4;font-size:clamp(15px,1.8vw,24px)}
.hint{font-size:clamp(16px,2vw,26px);color:#e3cfee}
.call{font-size:clamp(24px,3.6vw,50px);margin:.2em 0}
.timer{font-size:clamp(70px,15vw,210px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:#ff5c7a;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.oath{font-size:clamp(22px,3.6vw,50px);line-height:1.6;font-weight:700;background:rgba(255,255,255,.07);border-radius:20px;padding:.8em 1.2em}
.oath.sm{font-size:1.05em}
.howto{background:rgba(255,255,255,.08);border-radius:18px;padding:14px 22px;text-align:left;font-size:clamp(16px,2.1vw,28px);line-height:1.7;max-width:900px}
.howto h3{margin:0 0 4px}
.rolemini{font-size:clamp(14px,1.6vw,20px);color:#bfe9ff}
.scores{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px;padding:0 18px 12px}
.team{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 14px;border-top:6px solid var(--c);text-align:left}
.trow{display:flex;justify-content:space-between;align-items:center}
.tname{font-weight:900;font-size:1.2em}
.score{font-size:2.4em;font-weight:900;color:var(--c);line-height:1}
.roles{font-size:.92em;color:#ead9f3;margin:4px 0}
.st{display:inline-block;margin-top:6px;font-weight:700}.st.ok{color:#7dffb0}.st.wait{color:#ffd36b}
.proxy,.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.lobby{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:18px}
.joinbox{display:flex;gap:22px;align-items:center;justify-content:center;text-align:left}
.qr{background:#fff;padding:8px;border-radius:12px;width:170px;height:170px}.qr svg{width:100%;height:100%;display:block}
.code{font-size:clamp(44px,6.5vw,86px);font-weight:900;letter-spacing:.1em;color:#ffc74d;line-height:1.1}
.setup{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px}
.intro{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;width:100%;max-width:1200px}
.icard{background:rgba(255,255,255,.08);border-radius:20px;padding:20px;border-top:8px solid var(--c);font-size:clamp(16px,2vw,26px);line-height:1.7}
.iname{font-size:1.5em;font-weight:900;color:var(--c)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%;max-width:1200px;text-align:left}
.legend div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}
.scoring{display:flex;flex-direction:column;gap:10px;width:100%;max-width:950px}
.srow{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border-left:8px solid var(--c);border-radius:14px;padding:10px 14px}
.srow.friend{background:rgba(94,200,255,.12);border-left-style:dashed}
.sname{font-weight:900;font-size:1.2em;min-width:7em;text-align:left}
.sopts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:rgba(255,255,255,.12);font-size:1.15em;min-width:3.4em}
span.opt{display:inline-block;padding:.65em 1.1em;border-radius:14px;font-weight:700}
.opt.on{background:var(--c);color:#1a0f22}
.gains{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px;width:100%;max-width:1100px}
.gain{background:rgba(255,255,255,.08);border-radius:18px;padding:16px;border-top:8px solid var(--c)}
.gv{font-size:clamp(44px,7vw,96px);font-weight:900;color:var(--c,#ffc74d);line-height:1.1}
.rank{display:flex;flex-direction:column;gap:10px;width:100%;max-width:700px;position:relative;z-index:6}
.rrow{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.1);border-left:10px solid var(--c);border-radius:16px;padding:12px 20px;font-size:clamp(20px,2.6vw,34px)}
.rrow b{flex:1;text-align:left}.rs{font-weight:900;color:var(--c)}
.win{position:relative;z-index:6;font-size:clamp(34px,6.5vw,96px);font-weight:900;line-height:1.2;color:var(--c);text-shadow:0 0 30px var(--c);animation:winpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes winpop{from{transform:scale(.3);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

/* 設定頁 */
.cfg{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:14px;text-align:left}
.cfgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}
.cfgrow b{min-width:5em}
.seg{background:rgba(255,255,255,.12)}.seg.on{background:#ffc74d;color:#2a1600}
.cfgstage{background:rgba(255,255,255,.06);border-radius:16px;padding:12px 14px;border-left:8px solid var(--k)}
.cfgstage.off .qlist,.cfgstage.off .custrow,.cfgstage.off .stepper{opacity:.35;pointer-events:none}
.cfghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfghead .sname{color:var(--k);min-width:0}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.qlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.qrow{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(0,0,0,.2);font-weight:400;padding:.5em .8em;border-radius:10px;width:100%}
.qrow.on{background:rgba(255,255,255,.1)}
.qrow .ck{font-weight:900;color:var(--k)}
.qrow small{color:#c9b3d6;display:block}
.qrow .del{margin-left:auto;color:#ff8fb3;font-weight:900}
.custrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.custrow input{flex:1;min-width:200px;margin:0}

.client{max-width:560px;margin:0 auto;padding:10px 12px 40px;display:flex;flex-direction:column;gap:10px}
.cbar{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border-radius:14px;padding:10px 12px;border-left:6px solid var(--c,#ff5c9a);flex-wrap:wrap}
.cbar b{font-size:1.15em}.cscore{font-weight:900;color:var(--c);font-size:1.15em}
.cbar #net{flex:1;text-align:right}
.panel{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:1em;color:#e3cfee}
.center-t{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.cqtext{font-size:1.5em;font-weight:900;line-height:1.35}
.client .timer{font-size:4.5em}
.client .gv{font-size:3.5em}
.client .win{font-size:1.9em}.client .rrow{font-size:1.1em}
.client .howto{font-size:.95em}
.phase{font-weight:700;color:#ffd36b}
.pausebig{width:100%;font-size:1.25em;padding:.7em;background:rgba(255,255,255,.14)}
.crow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cicon{font-size:1.6em;width:1.6em;text-align:center}
.mini{display:flex;justify-content:space-between;padding:6px 10px;border-left:5px solid var(--c);margin:4px 0;background:rgba(0,0,0,.18);border-radius:8px}
.mini b{color:var(--c)}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:rgba(255,255,255,.09);border-left:8px solid var(--c);font-size:1.2em;padding:16px;text-align:left}
.pick span{font-weight:400;font-size:.8em;color:#e3cfee}
.modal{position:fixed;inset:0;background:rgba(10,4,16,.72);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.sheet{background:#2b1a3c;border-radius:22px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .25s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0;text-align:center}
.mq{margin:0;text-align:center;color:#e3cfee}
.cardbtn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#ff5c9a;padding:12px 14px}
.cardbtn small{display:block;font-weight:400;opacity:.9}
.pause-ov{position:fixed;inset:0;background:rgba(10,4,16,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.pause-ov .pi{font-size:5em}.pause-ov h1{margin:0;font-size:2.4em}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);background:#ffc74d;color:#2a1600;font-weight:900;padding:12px 22px;border-radius:16px;z-index:80;transition:transform .3s;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0)}
#toast.big{font-size:clamp(18px,2.6vw,34px)}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* 動畫共用 */
.fx-ov,.draw-ov{position:fixed;inset:0;z-index:70;background:rgba(8,3,14,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;animation:fadeout .35s forwards}
.fx-title{font-size:clamp(24px,4.5vw,56px);font-weight:900;color:#ffc74d;text-shadow:0 0 24px rgba(255,199,77,.6);padding:0 4vw}
.fx-sub{font-size:clamp(16px,2.6vw,30px);color:#e3cfee;padding:0 6vw}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
/* 抽題 */
.draw-title{font-size:clamp(24px,4.5vw,56px);font-weight:900;color:var(--k);text-shadow:0 0 24px var(--k)}
.flip{width:min(60vw,40vh);aspect-ratio:2/3;perspective:1400px;animation:dealin .4s ease-out,shake .8s ease-in-out .45s}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip .7s ease-in-out 1.4s forwards}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:9%;text-align:center}
.back{background:linear-gradient(135deg,var(--k),var(--k2));border:6px solid rgba(255,255,255,.55);box-shadow:0 0 70px var(--k);color:#fff}
.back .qm{font-size:clamp(70px,15vh,170px);font-weight:900;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.back small{font-size:clamp(16px,2.6vh,28px);font-weight:900;letter-spacing:.1em}
.front{background:#fff;color:#2a1033;transform:rotateY(180deg);border:8px solid var(--k);box-shadow:0 0 70px var(--k);font-weight:900;font-size:clamp(16px,3vh,38px);line-height:1.35}
.front .badge{background:var(--k);color:#fff;font-size:.6em}
@keyframes dealin{from{transform:translateY(60vh) rotate(-25deg) scale(.5);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateY(-4vh) rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:translateY(-2vh) rotate(-3deg)}}
@keyframes flip{to{transform:rotateY(180deg)}}
/* 換人 */
.swapbox{position:relative;width:min(86vw,640px);height:min(34vh,240px)}
.slot{position:absolute;top:0;width:44%;height:100%;border:3px dashed rgba(255,255,255,.3);border-radius:20px;display:flex;justify-content:center;padding-top:10px;font-weight:900;font-size:clamp(14px,2.2vw,24px);color:#e3cfee}
.slot.l{left:3%}.slot.r{left:53%}
.pill{position:absolute;top:42%;width:40%;padding:.6em .4em;border-radius:16px;font-size:clamp(18px,3.2vw,40px);font-weight:900;text-align:center;color:#1a0f22;box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.pa{left:5%;background:#ff6fa5;animation:swapA 2.2s ease-in-out forwards}
.pill.pb{left:55%;background:#5ec8ff;animation:swapB 2.2s ease-in-out forwards}
@keyframes swapA{0%,22%{transform:translate(0,0)}50%{transform:translate(62%,-70%) scale(1.15) rotate(-6deg)}78%,100%{transform:translate(125%,0)}}
@keyframes swapB{0%,22%{transform:translate(0,0)}50%{transform:translate(-62%,70%) scale(1.15) rotate(6deg)}78%,100%{transform:translate(-125%,0)}}
/* ×2 */
.x2big{font-size:min(42vw,46vh);font-weight:900;line-height:1;color:#ffc74d;text-shadow:0 0 50px #ffb300,0 0 120px #ff7a00;animation:x2grow 2s ease-out forwards}
@keyframes x2grow{0%{transform:scale(.15) rotate(-20deg);opacity:0}25%{transform:scale(1.25) rotate(4deg);opacity:1}45%{transform:scale(.95)}65%{transform:scale(1.12)}100%{transform:scale(1.5);opacity:.85}}
/* 放大鏡 */
.magbox{position:relative;width:min(80vw,560px);height:min(32vh,240px);display:flex;align-items:center;justify-content:center}
.mq-text{font-size:clamp(50px,11vw,130px);font-weight:900;letter-spacing:.25em;color:rgba(255,255,255,.25)}
.mq-text b{color:#ffc74d;text-shadow:0 0 30px #ffc74d;animation:glow .6s ease-in-out 2.1s both}
@keyframes glow{from{color:rgba(255,255,255,.25);text-shadow:none;transform:scale(1)}to{transform:scale(1.25)}}
.mag{position:absolute;left:50%;top:50%;font-size:clamp(70px,16vw,190px);animation:magmove 3s ease-in-out forwards;filter:drop-shadow(0 0 20px rgba(255,255,255,.4))}
@keyframes magmove{0%{transform:translate(120%,60%) scale(.5) rotate(20deg);opacity:0}15%{opacity:1}35%{transform:translate(20%,-60%) scale(1) rotate(-10deg)}55%{transform:translate(-130%,-20%) scale(1.05) rotate(10deg)}75%,100%{transform:translate(-115%,-55%) scale(1.3) rotate(0)}}

@media (max-width:760px){
 .scores,.setup,.intro,.gains{grid-template-columns:1fr}
 .joinbox{flex-direction:column;text-align:center}
 .srow{flex-direction:column;align-items:flex-start}
}
</style>
</head>

 swapQ:{icon:'🔄',n:2,when:'pre',stages:[0,1,2],zh:{n:'換題卡',d:'作答前使用，更換這一題（全場一起換）'},fr:{n:'Changement',d:"Avant de répondre : change la question (pour tout le monde)"}},
 swapP:{icon:'🔀',n:2,when:'pre',stages:[1,2],target:'any',zh:{n:'換人卡',d:'作答前使用，讓自己或別隊的猜題者與被猜者互換（中等、困難題）'},fr:{n:'Échange',d:"Avant de répondre : inverse devineur et deviné(e) de ton équipe ou d'une autre (Moyen, Difficile)"}},
 plus:{icon:'➕',n:2,when:'post',stages:[0,1,2],zh:{n:'加分卡',d:'答對時使用，分數再 +1'},fr:{n:'Bonus',d:"Après une bonne réponse : +1 point"}},
 double:{icon:'✨',n:1,when:'pre',stages:[0,1,2],zh:{n:'雙倍卡',d:'作答前使用，這題答對得分 ×2（每題每隊限用 1 張）'},fr:{n:'Double',d:"Avant de répondre : points ×2 sur cette question (1 par question et par équipe)"}},
 intel:{icon:'🕵️',n:2,when:'preAns',stages:[1,2],zh:{n:'情報卡',d:'作答前或作答中使用，可以問被猜者答案的第一個字（中等、困難題，每題每隊限 1 張）'},fr:{n:'Indice',d:"Avant ou pendant la réponse : demande la première lettre de la réponse à la personne devinée (Moyen, Difficile ; 1 par question et par équipe)"}},
 mime:{icon:'🙌',n:2,when:'preAns',stages:[1,2],zh:{n:'比手劃腳卡',d:'作答前或作答中使用，被猜者可以比手畫腳提示猜題者，不能說話、不能比數字（中等、困難題，每題每隊限 1 張）'},fr:{n:'Mime',d:"Avant ou pendant la réponse : la personne devinée peut mimer des indices, sans parler ni montrer de chiffres (Moyen, Difficile ; 1 par question et par équipe)"}},
 friend:{icon:'🤝',n:1,when:'pre',stages:[0,1,2],target:'other',zh:{n:'好友卡',d:'作答前使用，額外猜一隊的答案，猜對照該題計分給你們'},fr:{n:'Ami',d:"Avant de répondre : devinez aussi la réponse d'une autre équipe ; si c'est juste, vous marquez selon la question"}},
 troll:{icon:'😈',n:1,when:'pre',stages:[1,2],target:'other',zh:{n:'搗亂卡',d:'作答前使用，由你們幫別隊作答，答對分數還是算別隊的（中等、困難題）'},fr:{n:'Sabotage',d:"Avant de répondre : vous répondez à la place d'une autre équipe ; si c'est juste, les points restent à cette équipe (Moyen, Difficile)"}},
};
const buildDeck=()=>Object.keys(CARDS).flatMap(c=>Array(CARDS[c].n).fill(c));
const TC=['#ff6fa5','#5ec8ff','#ffc74d','#7dffb0'];
const CLIENT_ACTS=['pause','resume','useCard','useAns','done','setField','swapRoles'];
const NO_HIST=['pause','resume','undo','setField','cfgTeams','cfgMode','cfgStage','cfgCount','cfgSel','cfgAll','cfgAdd','cfgDel'];
const sn=s=>STAGE_INFO[s][LANG].n, sr=s=>STAGE_INFO[s][LANG].r, qt=q=>(LANG==='fr'&&q.fr)?q.fr:q.zh;
const cn=c=>CARDS[c][LANG].n, cd=c=>CARDS[c][LANG].d;

/* ============ 狀態 ============ */
let role=null,S=null,code=null,me=null,netMsg=null;
let undoStack=[],lastEventId,lastAnimId,ui={pick:null,proxy:null};
let peer=null,conns=[],conn=null,peerOk=false;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isPlayer=()=>typeof me==='number'&&S&&me<S.teams.length;
const NT=()=>S.teams.length;

const perQ=t=>Object.assign(t,{base:0,bonus:0,double:false,intelUsed:false,mimeUsed:false,friend:null,friendBase:0,trolledBy:null,gained:null});
const mkTeam=()=>perQ({name:'',a:'',b:'',score:0,hand:[]});
const defaultCfg=()=>({teams:3,mode:'couple',st:[0,1,2].map(s=>({on:true,count:STAGE_INFO[s].count,sel:BANKS.couple[s].map(()=>true),custom:[]}))});
function newState(){return{
 phase:'config',cfg:defaultCfg(),teams:[mkTeam(),mkTeam(),mkTeam()],deck:[],pool:[[],[],[]],order:[],si:0,counts:[6,5,5],
 stage:0,qNum:0,used:[[],[],[]],q:null,win:null,timer:{dur:0,left:0,running:false},paused:false,event:null,anim:null,draws:null}}

const tn=i=>S.teams[i].name||L('team'+i);
const cnt=(i,c)=>S.teams[i].hand.filter(x=>x===c).length;
const cntTag=(i,c)=>cnt(i,c)>1?` ×${cnt(i,c)}`:'';
const curQ=()=>S.q==null?null:(S.pool[S.stage]||[])[S.q]||null;
const poolLeft=()=>(S.pool[S.stage]||[]).length-S.used[S.stage].length;
function qNote(q=curQ()){if(!q)return'';if(S.stage===0)return L('noteEasy');if(q.each)return L('noteEach',{m:q.max});if(q.multi)return L('noteMulti');return L('noteRight',{v:q.pts})}
function scoreOpts(){const q=curQ();if(!q)return[0,1];if(q.each)return Array.from({length:q.max+1},(_,i)=>i);return[0,q.pts||1]}
const cfgAvail=s=>S.cfg.st[s].sel.filter(Boolean).length+S.cfg.st[s].custom.length;

function usable(i,kind){
 const t=S.teams[i],out=[];
 for(const c of t.hand){
  if(out.includes(c))continue;
  const C=CARDS[c];
  if(!C.stages.includes(S.stage))continue;
  if(kind==='pre'&&!(C.when==='pre'||C.when==='preAns'))continue;
  if(kind==='post'&&C.when!=='post')continue;
  if(kind==='ans'&&C.when!=='preAns')continue;
  if(c==='swapQ'&&poolLeft()===0)continue;
  if(c==='double'&&t.double)continue;
  if(c==='intel'&&t.intelUsed)continue;
  if(c==='mime'&&t.mimeUsed)continue;
  if(c==='friend'&&(t.friend!=null||NT()<2))continue;
  if(c==='troll'&&!S.teams.some((x,j)=>j!==i&&x.trolledBy==null))continue;
  if(c==='plus'&&!(t.base>0||t.friendBase>0))continue;
  out.push(c);
 }
 return out;
}

/* ============ 遊戲邏輯（只在主持人端執行） ============ */
const newId=()=>Date.now()+'-'+Math.random();
function event(e){S.event={id:newId(),...e}}
function evText(e){
 if(e.k==='undo')return L('ev_undo');
 if(e.k==='card'&&S.teams[e.team]){
  const base=L('ev_use',{i:CARDS[e.c].icon,t:tn(e.team),c:cn(e.c)});
  const o=S.teams[e.target]?tn(e.target):'';
  return base+(e.c==='swapP'&&e.target===e.team?L('ev_swapPself'):L('ev_'+e.c,{o}));
 }
 return'';
}
function openWindow(kind){S.win={kind,done:S.teams.map((t,i)=>usable(i,kind).length===0),used:S.teams.map(()=>false)}}
function drawNewQ(k){
 const pool=S.pool[S.stage].map((_,i)=>i).filter(i=>!S.used[S.stage].includes(i));
 S.q=pool[Math.floor(Math.random()*pool.length)];
 S.used[S.stage].push(S.q);
 S.anim={id:newId(),k,stage:S.stage,q:S.q};
}
function drawQuestion(){S.teams.forEach(perQ);drawNewQ('draw');S.phase='pre';openWindow('pre')}
function applyScores(){
 const dbl=[];
 S.teams.forEach((t,i)=>{t.gained=t.base*(t.double?2:1)+t.bonus+t.friendBase;t.score+=t.gained;if(t.double&&t.base>0)dbl.push(i)});
 if(dbl.length)S.anim={id:newId(),k:'x2',teams:dbl};
 S.win=null;S.phase='result';
}
function cardEffect(team,card,target){
 const t=S.teams[team],C=CARDS[card];
 if(C.target){
  if(!(target>=0&&target<NT()))return false;
  if(C.target==='other'&&target===team)return false;
  if(card==='troll'&&S.teams[target].trolledBy!=null)return false;
 }
 t.hand.splice(t.hand.indexOf(card),1);
 switch(card){
  case'swapQ':drawNewQ('swap');openWindow('pre');break;
  case'swapP':{const tt=S.teams[target];[tt.a,tt.b]=[tt.b,tt.a];S.anim={id:newId(),k:'swapP',team:target};break}
  case'double':t.double=true;break;
  case'intel':t.intelUsed=true;S.anim={id:newId(),k:'intel',team};break;
  case'mime':t.mimeUsed=true;break;
  case'friend':t.friend=target;break;
  case'troll':S.teams[target].trolledBy=team;break;
  case'plus':t.bonus+=1;break;
 }
 event({k:'card',c:card,team,target});
 if(S.win){S.win.used[team]=true;if(usable(team,S.win.kind).length===0)S.win.done[team]=true}
}
function stageEndDraws(){
 const draws=[],give=(i,why)=>{const c=S.deck.pop()||null;if(c)S.teams[i].hand.push(c);draws.push({team:i,card:c,why})};
 if(S.stage===1)S.teams.forEach((_,i)=>give(i,'all'));
 const mn=Math.min(...S.teams.map(t=>t.score));
 S.teams.forEach((t,i)=>{if(t.score===mn)give(i,'low')});
 S.draws=draws;
}
function reduce(a){
 const N=NT();
 switch(a.type){
 /* 設定頁 */
 case'cfgTeams':{if(S.phase!=='config')return false;const v=Math.max(2,Math.min(4,a.v|0));S.cfg.teams=v;while(S.teams.length<v)S.teams.push(mkTeam());S.teams.length=v;break}
 case'cfgMode':{if(S.phase!=='config'||!BANKS[a.mode])return false;S.cfg.mode=a.mode;S.cfg.st.forEach((c,s)=>{c.sel=BANKS[a.mode][s].map(()=>true);c.count=Math.min(STAGE_INFO[s].count,cfgAvail(s))||1});break}
 case'cfgStage':{if(S.phase!=='config')return false;S.cfg.st[a.stage].on=!S.cfg.st[a.stage].on;break}
 case'cfgCount':{if(S.phase!=='config')return false;const c=S.cfg.st[a.stage];c.count=Math.max(1,Math.min(cfgAvail(a.stage)||1,c.count+a.v));break}
 case'cfgSel':{if(S.phase!=='config')return false;const c=S.cfg.st[a.stage];c.sel[a.qi]=!c.sel[a.qi];c.count=Math.max(1,Math.min(c.count,cfgAvail(a.stage)||1));break}
 case'cfgAll':{if(S.phase!=='config')return false;const c=S.cfg.st[a.stage],all=c.sel.every(Boolean);c.sel=c.sel.map(()=>!all);c.count=Math.max(1,Math.min(all?c.count:STAGE_INFO[a.stage].count,cfgAvail(a.stage)||1));break}
 case'cfgAdd':{if(S.phase!=='config')return false;const text=String(a.text||'').trim().slice(0,120);if(!text)return false;const s=a.stage;
  const q=s===0?{pts:1}:a.ctype==='each'?{each:true,max:3}:{pts:s===1?2:3};S.cfg.st[s].custom.push({zh:text,fr:text,custom:true,...q});break}
 case'cfgDel':{if(S.phase!=='config')return false;S.cfg.st[a.stage].custom.splice(a.qi,1);const c=S.cfg.st[a.stage];c.count=Math.max(1,Math.min(c.count,cfgAvail(a.stage)||1));break}
 case'cfgDone':{
  if(S.phase!=='config')return false;
  const mode=S.cfg.mode;
  S.pool=[0,1,2].map(s=>[...BANKS[mode][s].filter((_,i)=>S.cfg.st[s].sel[i]),...S.cfg.st[s].custom]);
  S.order=[0,1,2].filter(s=>S.cfg.st[s].on&&S.pool[s].length>0);
  if(!S.order.length)return false;
  S.counts=[0,1,2].map(s=>Math.max(1,Math.min(S.cfg.st[s].count,S.pool[s].length)));
  S.si=0;S.stage=S.order[0];S.phase='lobby';break}
 case'backCfg':if(S.phase!=='lobby')return false;S.phase='config';break;
 /* 大廳 */
 case'setField':{if(S.phase!=='lobby'||!['name','a','b'].includes(a.field))return false;S.teams[a.team][a.field]=String(a.value??'').slice(0,12);break}
 case'swapRoles':{if(S.phase!=='lobby')return false;const t=S.teams[a.team];[t.a,t.b]=[t.b,t.a];break}
 case'start':if(S.phase!=='lobby')return false;S.phase='intro';break;
 case'oath':S.phase='oath';break;
 case'deal':S.deck=shuffle(buildDeck());S.teams.forEach(t=>{t.hand=[S.deck.pop(),S.deck.pop()]});S.phase='deal';break;
 case'stageIntro':S.phase='stageIntro';break;
 case'draw':if(S.phase!=='stageIntro')return false;drawQuestion();break;
 /* 卡片 */
 case'useCard':{if(!S.win||!usable(a.team,S.win.kind).includes(a.card))return false;const r=cardEffect(a.team,a.card,a.target);if(r===false)return false;
  if(S.win&&S.win.kind==='post'&&S.win.done.every(Boolean))applyScores();break}
 case'useAns':{if(S.phase!=='answering'||!usable(a.team,'ans').includes(a.card))return false;return cardEffect(a.team,a.card)}
 case'done':if(!S.win)return false;S.win.done[a.team]=true;if(S.win.kind==='post'&&S.win.done.every(Boolean))applyScores();break;
 /* 作答與計分 */
 case'startAnswer':{if(S.phase!=='pre')return false;const ms=STAGE_INFO[S.stage].time*1000;S.win=null;S.phase='answering';S.timer={dur:ms,left:ms,running:true};S.paused=false;lastBeep=null;break}
 case'endAnswer':if(S.phase!=='answering')return false;S.timer.running=false;S.timer.left=0;S.phase='reveal';break;
 case'setBase':if(S.phase!=='reveal')return false;S.teams[a.team].base=a.v;break;
 case'setFriend':if(S.phase!=='reveal'||S.teams[a.team].friend==null)return false;S.teams[a.team].friendBase=a.v;break;
 case'confirmScore':if(S.phase!=='reveal')return false;S.phase='post';openWindow('post');if(S.win.done.every(Boolean))applyScores();break;
 case'apply':if(S.phase!=='post')return false;applyScores();break;
 case'next':
  if(S.phase!=='result')return false;
  S.qNum++;
  if(S.qNum<S.counts[S.stage]){drawQuestion();break}
  if(S.si<S.order.length-1){stageEndDraws();S.phase='stageEnd'}else S.phase='final';
  break;
 case'nextStage':if(S.phase!=='stageEnd')return false;S.si++;S.stage=S.order[S.si];S.qNum=0;S.q=null;S.phase='stageIntro';break;
 case'pause':S.paused=true;break;
 case'resume':S.paused=false;break;
 case'undo':if(!undoStack.length)return false;S=JSON.parse(undoStack.pop());S.anim=null;ui.pick=null;event({k:'undo'});break;
 case'reset':{const old=S.teams,cfg=S.cfg;S=newState();S.cfg=cfg;S.teams=old.map(o=>{const t=mkTeam();t.name=o.name;t.a=o.a;t.b=o.b;return t});undoStack=[];break}
 default:return false;
 }
}
function dispatch(a,fromClient){
 if(role==='client'){if(conn&&conn.open)conn.send({t:'act',a});else toast(L('notConn'));return}
 if(fromClient&&!CLIENT_ACTS.includes(a.type))return;
 if(a.team!==undefined&&!(a.team>=0&&a.team<NT()))return;
 if(a.stage!==undefined&&!(a.stage>=0&&a.stage<3))return;
 const before=JSON.stringify(S);
 if(reduce(a)===false)return;
 if(!NO_HIST.includes(a.type)&&a.type!=='reset'){undoStack.push(before);if(undoStack.length>60)undoStack.shift()}
 commit();
}
function commit(){save();broadcast();render();checkFx()}
function save(){if(role==='host')try{localStorage.setItem('cplq-host2',JSON.stringify({code,S,undo:undoStack.slice(-25)}))}catch(e){}}

/* ============ 收到的資料逐欄檢查，避免被塞入惡意內容 ============ */
const PHASES=['config','lobby','intro','oath','deal','stageIntro','pre','answering','reveal','post','result','stageEnd','final'];
const int=(v,lo,hi,d=0)=>{v=Math.floor(Number(v));return Number.isFinite(v)&&v>=lo&&v<=hi?v:d};
const num=v=>{v=Number(v);return Number.isFinite(v)?Math.round(v):0};
const str=(v,n=12)=>String(v??'').slice(0,n);
const card=c=>typeof c==='string'&&Object.prototype.hasOwnProperty.call(CARDS,c)?c:null;
const cleanQ=q=>{q=q&&typeof q==='object'?q:{};const o={zh:str(q.zh,150),fr:str(q.fr,250)};if(q.each){o.each=true;o.max=int(q.max,1,5,3)}else o.pts=int(q.pts,1,5,1);if(q.multi)o.multi=true;return o};
function cleanState(s){
 if(!s||typeof s!=='object')return null;
 const n=int(Array.isArray(s.teams)?s.teams.length:0,2,4,3);
 const ti=v=>v==null?null:int(v,0,n-1,null);
 const pool=[0,1,2].map(k=>(Array.isArray(s.pool)&&Array.isArray(s.pool[k])?s.pool[k]:[]).slice(0,40).map(cleanQ));
 const stage=int(s.stage,0,2);
 const phase=PHASES.includes(s.phase)?s.phase:'config';
 let q=s.q==null?null:int(s.q,0,Math.max(0,pool[stage].length-1),null);
 if(['pre','answering','reveal','post'].includes(phase)&&(q==null||!pool[stage][q]))return null;
 const teams=Array.from({length:n},(_,i)=>{const t=s.teams[i]||{};return{name:str(t.name),a:str(t.a),b:str(t.b),score:num(t.score),base:num(t.base),bonus:num(t.bonus),friendBase:num(t.friendBase),gained:t.gained==null?null:num(t.gained),
  double:!!t.double,intelUsed:!!t.intelUsed,mimeUsed:!!t.mimeUsed,friend:ti(t.friend),trolledBy:ti(t.trolledBy),hand:(Array.isArray(t.hand)?t.hand:[]).map(card).filter(Boolean).slice(0,14)}});
 const w=s.win&&typeof s.win==='object'&&['pre','post'].includes(s.win.kind)?{kind:s.win.kind,done:teams.map((_,i)=>!!(s.win.done||[])[i]),used:teams.map((_,i)=>!!(s.win.used||[])[i])}:null;
 const e=s.event&&typeof s.event==='object'&&['card','undo'].includes(s.event.k)?{id:str(s.event.id,40),k:s.event.k,c:card(s.event.c)||'intel',team:int(s.event.team,0,n-1),target:ti(s.event.target)}:null;
 let an=null;
 if(s.anim&&typeof s.anim==='object'){const A=s.anim,k=['draw','swap','swapP','x2','intel'].includes(A.k)?A.k:null;
  if(k){const st=int(A.stage,0,2);an={id:str(A.id,40),k,stage:st,q:int(A.q,0,Math.max(0,pool[st].length-1)),team:int(A.team,0,n-1),teams:(Array.isArray(A.teams)?A.teams:[]).slice(0,4).map(x=>int(x,0,n-1))}}}
 return{phase,teams,deck:[],pool,order:(Array.isArray(s.order)?s.order:[]).slice(0,3).map(x=>int(x,0,2)),si:int(s.si,0,2),counts:[0,1,2].map(k=>int((s.counts||[])[k],0,40)),
  stage,qNum:int(s.qNum,0,40),used:[[],[],[]],q,win:w,timer:{dur:0,left:Math.max(0,num(s.timer&&s.timer.left)),running:false},paused:!!s.paused,event:e,anim:an,
  draws:Array.isArray(s.draws)?s.draws.slice(0,12).map(d=>({team:int(d&&d.team,0,n-1),card:card(d&&d.card),why:d&&d.why==='all'?'all':'low'})):null};
}

/* ============ 連線（PeerJS） ============ */
function broadcast(){const m={t:'state',s:S};conns.forEach(c=>{try{if(c.open)c.send(m)}catch(e){}})}
function tickBroadcast(){conns.forEach(c=>{try{if(c.open)c.send({t:'tick',left:S.timer.left})}catch(e){}})}
function setNet(k,p){netMsg=k?{k,p}:null;updateNet()}
function hostNet(){
 if(!window.Peer){setNet('peerFail');return}
 try{if(peer)peer.destroy()}catch(e){}
 peerOk=false;conns=[];
 peer=new Peer('cplq-'+code);
 peer.on('open',()=>{peerOk=true;setNet(null)});
 peer.on('connection',c=>{
  c.on('open',()=>{conns.push(c);try{c.send({t:'state',s:S})}catch(e){}updateNet()});
  c.on('data',d=>{
   if(!d||d.t!=='act'||!d.a||typeof d.a!=='object'||typeof d.a.type!=='string')return;
   const x=d.a,N=NT();
   dispatch({type:x.type,team:x.team===undefined?undefined:int(x.team,0,N-1,-1),card:card(x.card)||undefined,target:x.target===undefined?undefined:int(x.target,0,N-1,-1),field:typeof x.field==='string'?x.field:undefined,value:typeof x.value==='string'?x.value:undefined},true);
  });
  c.on('close',()=>{conns=conns.filter(x=>x!==c);updateNet()});
  c.on('error',()=>{});
 });
 peer.on('error',e=>{
  if(e.type==='unavailable-id'){setNet('idBusy');setTimeout(hostNet,4000);return}
  if(e.type==='peer-unavailable')return;
  peerOk=false;setNet('connErr',{e:e.type});
  setTimeout(()=>{try{peer.destroyed?hostNet():peer.reconnect()}catch(_){hostNet()}},3000);
 });
 peer.on('disconnected',()=>{peerOk=false;updateNet();setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},2000)});
}
let retryT;
function startClient(c){
 role='client';code=c;
 const saved=localStorage.getItem('cplq-me-'+code);
 me=saved==='spec'?'spec':(saved==null?null:Number(saved));
 setNet('connecting');render();
 if(!window.Peer){setNet('peerFail');render();return}
 peer=new Peer();
 peer.on('open',connectHost);
 peer.on('error',e=>{
  if(e.type==='peer-unavailable'){setNet('roomNotFound',{c:code});retryConnect()}
  else{setNet('connErr',{e:e.type});setTimeout(()=>{try{peer.reconnect()}catch(_){}},3000)}
 });

}
function retryConnect(){clearTimeout(retryT);retryT=setTimeout(connectHost,2500)}
function connectHost(){
 if(conn&&conn.open)return;
 try{if(conn)conn.close()}catch(e){}
 conn=peer.connect('cplq-'+code,{reliable:true});
 conn.on('open',()=>setNet(null));
 conn.on('data',d=>{
  if(!d)return;
  if(d.t==='state'){const c=cleanState(d.s);if(!c)return;S=c;if(!S.win)ui.pick=null;render();checkFx()}
  else if(d.t==='tick'&&S){S.timer.left=Math.max(0,num(d.left));updateTimer()}
 });
 conn.on('close',()=>{setNet('disconnected');retryConnect()});
 conn.on('error',()=>retryConnect());
}

let actx=null,lastBeep=null,lastT=performance.now(),wl=null;
function unlockAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(f,d){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.3,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d+.05)}catch(e){}}
async function requestWake(){try{if('wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake()});
const fmt=ms=>{const s=Math.ceil(ms/1000);return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:String(s)};
function updateTimer(){
 if(!S)return;
 const left=S.timer.left,low=left<=(S.stage===0?3000:10000);
 document.querySelectorAll('.timer').forEach(el=>{el.textContent=fmt(left);el.classList.toggle('low',low)});
 document.querySelectorAll('.timer-inline').forEach(el=>el.textContent=fmt(left)+' s');
}
setInterval(()=>{
 const now=performance.now(),dt=now-lastT;lastT=now;
 if(role!=='host'||!S||S.phase!=='answering'||!S.timer.running||S.paused)return;
 S.timer.left=Math.max(0,S.timer.left-dt);
 const sec=Math.ceil(S.timer.left/1000);
 if(sec!==lastBeep){lastBeep=sec;if(sec>0&&sec<=3)beep(660,.15)}
 if(S.timer.left<=0){beep(880,.7);dispatch({type:'endAnswer'});return}
 updateTimer();tickBroadcast();
},200);

  html=ov(dur,`<div class="fx-title">${L('an_swapP',{t:esc(tn(a.team))})}</div><div class="swapbox"><div class="slot l">🎯 ${L('guesser')}</div><div class="slot r">💭 ${L('guessed')}</div><div class="pill pa">${esc(t.b||'?')}</div><div class="pill pb">${esc(t.a||'?')}</div></div>`);
  if(role==='host'){beep(520,.12);setTimeout(()=>beep(780,.12),600);setTimeout(()=>beep(1040,.2),1300)}
 }else if(a.k==='x2'){
  dur=2;const names=(a.teams||[]).filter(i=>S.teams[i]).map(i=>esc(tn(i))).join(L('and'));
  html=ov(dur,`<div class="x2big">×2</div><div class="fx-title">${L('an_x2',{t:names})}</div>`);
  if(role==='host'){beep(660,.1);setTimeout(()=>beep(880,.1),150);setTimeout(()=>beep(1320,.4),300)}
 }else if(a.k==='intel'){
  if(!S.teams[a.team])return;
  html=ov(dur,`<div class="fx-title">${L('an_intel')}</div><div class="magbox"><div class="mq-text"><b>?</b>？？</div><div class="mag">🔍</div></div><div class="fx-sub">${L('an_intelSub',{t:esc(tn(a.team))})}</div>`);
  if(role==='host'){[0,500,1000,1500].forEach(d=>setTimeout(()=>beep(900,.05),d));setTimeout(()=>beep(1250,.3),2100)}
 }
 $('#fx').innerHTML=html;
 clearTimeout(animT);animT=setTimeout(()=>$('#fx').innerHTML='',dur*1000);
}

 case'final':main=finalHTML();ctrl=`<button class="ghost" data-act="reset">${L('again')}</button>`;scores=false;break;
 }
 if(ro)scores=!['config','lobby','final'].includes(S.phase);
 const tools=ro
  ?`<span class="rolebadge">${L('roleSpec')}</span><button class="ghost" data-act="pause">${L('pause')}</button><button class="ghost" data-act="leaveTeam">${L('switchBtn')}</button>`
  :`<span class="rolebadge">${L('roleHost')}</span><button class="ghost" data-act="pause">${L('pause')}</button><button class="ghost" data-act="undo" ${undoStack.length?'':'disabled'}>${L('undo')}</button>${!['config','lobby','final'].includes(S.phase)?'<button class="ghost" data-act="reset">⟲</button>':''}`;
 app.innerHTML=`<div class="host">
  <header class="bar"><div class="brand">💞 ${L('title')}</div><div id="net">${netBadge()}</div><div class="tools">${tools}${langSel()}</div></header>
  <main class="stage-main">${main}</main>
  ${scores?`<div class="scores" style="--n:${NT()}">${S.teams.map((_,i)=>teamCardHTML(i,ro)).join('')}</div>`:''}
  ${ro||!ctrl?'':`<footer class="ctrl">${ctrl}</footer>`}
 </div>${pauseOverlay()}`;
}
function cardModal(){
 if(!S.win||!isPlayer()||S.win.done[me])return'';
 const list=usable(me,S.win.kind),pre=S.win.kind==='pre';
 const body=ui.pick&&ui.pick.team===me?targetChooser(me,ui.pick.card,false):list.map(c=>`<button class="cardbtn" data-act="useCard" data-team="${me}" data-card="${c}"><span class="cicon">${CARDS[c].icon}</span><span><b>${L('use',{c:cn(c)})}${cnt(me,c)>1?L('have',{n:cnt(me,c)}):''}</b><small>${cd(c)}</small></span></button>`).join('');
 return `<div class="modal"><div class="sheet"><h2>${L(pre?'useCardQ':'plusQ')}</h2>${pre&&curQ()?`<p class="mq">${L('qLabel')}${esc(qt(curQ()))}</p>`:''}${body}<button class="ghost big full" data-act="done" data-team="${me}">${L(pre?'noThanks':'no')}</button></div></div>`;
}
function renderClient(){
 const ae=document.activeElement;if(S&&S.phase==='lobby'&&isPlayer()&&ae&&ae.dataset&&ae.dataset.tf!==undefined){updateNet();return}
 if(!S){app.innerHTML=`<div class="toplang">${langSel()}</div><div class="center"><div style="font-size:4em">💞</div><p id="net">${netBadge()}</p></div>`;return}
 if(me==='spec'){renderStage(true);return}
 if(!isPlayer()){
  app.innerHTML=`<div class="client"><header class="cbar"><b>${L('pickTitle')}</b><span id="net" class="small">${netBadge()}</span>${langSel()}</header>
   ${S.phase==='config'?`<p class="muted" style="text-align:center">${L('cfgWait')}</p>`:''}
   ${S.teams.map((t,i)=>`<button class="pick" style="--c:${TC[i]}" data-act="pickTeam" data-team="${i}"><b>${L('joinTeam',{t:esc(tn(i))})}</b><span>${esc([t.a,t.b].filter(Boolean).join(L('and')))||L('noNames')}</span></button>`).join('')}
   <button class="pick" style="--c:#bbb" data-act="pickSpec"><b>${L('spectator')}</b><span>${L('specDesc')}</span></button></div>${pauseOverlay()}`;
  return;
 }
 const t=S.teams[me],st=S.stage,q=curQ();let mid='';
 switch(S.phase){
 case'config':mid=`<p class="muted">${L('cfgWait')}</p>`;break;
 case'lobby':mid=`<h3 style="margin:0">${L('setupTeam')}</h3><div style="width:100%">
  <label>${L('teamName')}<input data-tf="name" value="${esc(t.name)}" placeholder="${esc(L('team'+me))}" maxlength="12"></label>
  <label>${L('guesserLong')}<input data-tf="a" value="${esc(t.a)}" placeholder="${L('nameP')}" maxlength="12"></label>
  <label>${L('guessedLong')}<input data-tf="b" value="${esc(t.b)}" placeholder="${L('nameP')}" maxlength="12"></label>
  <button class="ghost sm" data-act="swapRoles" data-team="${me}">${L('swapRolesBtn')}</button></div>
  <p class="muted small">${L('lockHint')}</p>`;break;
 case'intro':mid=`<p>${L('introC')}</p>`;break;
 case'oath':mid=`<div class="oath sm">${L('oath')}</div>`;break;
 case'deal':mid=`<p>${L('dealC')}</p>`;break;
 case'stageIntro':mid=`<div class="badge" style="background:${STAGE_COL[st][0]};color:#1a0f22">${sn(st)}</div><p>${sr(st)}</p>${st>0?howtoHTML():''}`;break;
 case'pre':case'answering':case'reveal':case'post':{
  const ph={pre:L('phasePre'),answering:L(st===0?'phaseAnsEasy':'phaseAns'),reveal:L('phaseRev'),post:L('phasePost')}[S.phase];
  const ansBtns=S.phase==='answering'?usable(me,'ans').map(c=>`<button data-act="useAns" data-team="${me}" data-card="${c}">${CARDS[c].icon} ${L('use',{c:cn(c)})}${cntTag(me,c)}</button>`).join(''):'';
  const roleL=st>0?`<div class="rolemini">${t.a&&t.b?L('roleMini',{a:esc(t.a),b:esc(t.b)}):L('roleMiniG')}</div>`:'';
  mid=`<div class="badge" style="background:${STAGE_COL[st][0]};color:#1a0f22">${sn(st)} · ${L('qof',{n:S.qNum+1,m:S.counts[st]})}</div><div class="cqtext">${esc(qt(q))}</div><div class="note">${qNote()}</div>${roleL}${S.phase==='answering'?'<div class="timer"></div>':''}<div class="phase">${ph}</div>${ansBtns}<div>${teamTags(me)}</div>`;break}
 case'result':mid=`<p>${L('thisQ')}</p><div class="gv" style="--c:${TC[me]}">+${t.gained||0}</div>`;break;
 case'stageEnd':{const mine=(S.draws||[]).filter(d=>d.team===me);mid=`<p>${L('stageOver',{s:sn(st)})}</p>${mine.length?`<p>${L('youDrew')} <b>${mine.map(d=>d.card?CARDS[d.card].icon+' '+cn(d.card):L('deckEmpty')).join('、')}</b></p>`:''}`;break}
 case'final':mid=finalHTML();break;
 }
 app.innerHTML=`<div class="client" style="--c:${TC[me]}">
  <header class="cbar"><span class="rolebadge">${L('rolePlayer')}</span><b>${esc(tn(me))}</b><span class="cscore">${t.score} ${L('ptsUnit')}</span><span id="net" class="small">${netBadge()}</span><button class="ghost sm" data-act="leaveTeam">${L('switchBtn')}</button>${langSel()}</header>
  <section class="panel center-t">${mid}</section>
  <button class="pausebig" data-act="pause">${L('pause')}</button>
  <section class="panel"><div class="roles">🎯 ${L('guesser')} <b>${esc(t.a||'—')}</b>　💭 ${L('guessed')} <b>${esc(t.b||'—')}</b></div></section>
  <section class="panel"><h3>${L('myCards',{n:t.hand.length})}</h3>${t.hand.length?t.hand.map(c=>`<div class="crow"><span class="cicon">${CARDS[c].icon}</span><div style="flex:1"><b>${cn(c)}</b><div class="muted small">${cd(c)}</div></div></div>`).join(''):`<p class="muted">${L('noCards')}</p>`}<p class="muted small">${L('autoAsk')}</p></section>
  <section class="panel"><h3>${L('scoreTitle')}</h3>${S.teams.map((x,i)=>`<div class="mini" style="--c:${TC[i]}"><span>${esc(tn(i))}</span><b>${x.score}</b></div>`).join('')}</section>
 </div>${cardModal()}${pauseOverlay()}`;
}

/* ============ 操作 ============ */
function startHost(resume){
 role='host';
 if(resume){try{const d=JSON.parse(localStorage.getItem('cplq-host2'));if(!d.S.cfg||!d.S.pool)throw 0;code=d.code;S=d.S;undoStack=d.undo||[]}catch(e){resume=false}}
 if(!resume){code=String(Math.floor(100000+Math.random()*900000));S=newState();undoStack=[]}
 if(S.phase==='answering')S.paused=true;
 lastEventId=S.event?S.event.id:null;lastAnimId=S.anim?S.anim.id:null;
 save();render();hostNet();
}
function setMe(v){me=v;if(v===null)localStorage.removeItem('cplq-me-'+code);else localStorage.setItem('cplq-me-'+code,String(v));ui.pick=null;render()}
function handleLocal(a){
 switch(a.type){
 case'hostNew':startHost(false);return true;
 case'hostResume':startHost(true);return true;
 case'join':{const v=($('#joinCode').value||'').trim();if(!/^\d{6}$/.test(v)){toast(L('code4'));return true}history.replaceState(null,'','?join='+v);startClient(v);return true}
 case'pickTeam':setMe(a.team);return true;
 case'pickSpec':setMe('spec');return true;
 case'leaveTeam':setMe(null);return true;
 case'pickCancel':ui.pick=null;render();return true;
 case'proxyOpen':ui.proxy=a.team;ui.pick=null;render();return true;
 case'proxyClose':ui.proxy=null;ui.pick=null;render();return true;
 case'reset':if(!confirm(L('resetConfirm')))return true;return false;
 case'cfgAdd':{const el=$('#cust-'+a.stage),ty=$('#ctype-'+a.stage);a.text=el?el.value:'';a.ctype=ty?ty.value:'pts';if(!a.text.trim()){toast(L('cfgEmpty'));return true}return false}
 case'cfgDone':{const ok=[0,1,2].some(s=>S.cfg.st[s].on&&cfgAvail(s)>0);if(!ok){toast(L('cfgNeedOne'));return true}return false}
 case'useCard':if(CARDS[a.card]&&CARDS[a.card].target&&a.target===undefined){ui.pick={team:a.team,card:a.card};render();return true}ui.pick=null;return false;
 }
 return false;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 unlockAudio();requestWake();
 const a={type:b.dataset.act};
 ['team','target','v','stage','qi'].forEach(k=>{if(b.dataset[k]!==undefined)a[k]=Number(b.dataset[k])});
 if(b.dataset.card)a.card=b.dataset.card;
 if(b.dataset.mode)a.mode=b.dataset.mode;
 if(handleLocal(a))return;
 dispatch(a);
});
let tfT;
function sendTF(el){clearTimeout(tfT);if(!isPlayer())return;S.teams[me][el.dataset.tf]=el.value;dispatch({type:'setField',team:me,field:el.dataset.tf,value:el.value})}
document.addEventListener('input',e=>{const el=e.target;if(role==='client'&&el.dataset.tf!==undefined){clearTimeout(tfT);tfT=setTimeout(()=>sendTF(el),400)}});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.lang!==undefined){LANG=el.value==='fr'?'fr':'zh';localStorage.setItem('cplq-lang',LANG);render();return}
 if(role==='client'&&el.dataset.tf!==undefined)sendTF(el);
});
document.addEventListener('focusout',e=>{if(role==='client'&&e.target.dataset&&e.target.dataset.tf!==undefined)setTimeout(render,60)});
document.addEventListener('keydown',e=>{
 if(e.target.id==='joinCode'&&e.key==='Enter')handleLocal({type:'join'});
 if(e.target.id&&e.target.id.startsWith('cust-')&&e.key==='Enter'){const s=Number(e.target.id.slice(5));const a={type:'cfgAdd',stage:s};if(!handleLocal(a))dispatch(a)}
});

const jp=new URLSearchParams(location.search).get('join');
if(jp&&/^\d{6}$/.test(jp))startClient(jp);else render();
</script>
</body>
